<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的博客</title>
    <link rel = "stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <span class="site-name">soyorin的博客</span>
        <nav class="site-nav">
